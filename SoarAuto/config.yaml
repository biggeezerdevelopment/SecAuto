# SecAuto Configuration File

# Server Configuration
server:
  port: 9090
  host: "localhost"

# Logging Configuration
logging:
  level: "DEBUG"
  destination: "both"
  file: "logs/secauto.log"
  rotation:
    max_size_mb: 10
    max_backups: 5
    max_age_days: 30
    compress: true
  format: "json"
  include_timestamp: true
  include_component: true
  include_request_id: true
  # Component-specific logging levels for performance optimization
  component_levels:
    rules_engine: "WARNING"     # Reduce verbosity in production
    redis_integration: "ERROR"  # Only log errors for Redis operations
    job_manager: "INFO"         # Normal logging for job management
    webhook_system: "INFO"      # Normal logging for webhooks
    plugin_system: "WARNING"    # Reduce plugin execution verbosity
    cluster_manager: "INFO"     # Normal logging for clustering
    default: "INFO"             # Default level for unlisted components
  # Performance settings
  performance:
    skip_context_logging: true      # Skip logging large context objects in production
    max_log_field_length: 1000      # Truncate long field values
    batch_logging: false            # Enable for high-throughput scenarios
    async_logging: false            # Enable for better performance (experimental)

# Database Configuration (Redis)
database:
  redis_url: "redis://localhost:6379/0"
  # TTL settings in seconds (0 = no expiration)
  cache_ttl: 3600        # 1 hour for general cache entries
  job_ttl: 86400         # 24 hours for completed/failed jobs
  temp_data_ttl: 300     # 5 minutes for temporary data
  postgres:
      host: "localhost"
      port: 5432
      database: "soar_auto"
      username: "ddfelts"
      password: ""
      ssl_mode: "disable"
      encryption_key: "your-32-character-encryption-key"

# Cluster Configuration
cluster:
  enabled: false
  redis_url: "redis://localhost:6379/1"
  redis_db: 1
  redis_password: ""
  redis_pool_size: 10
  redis_pool_timeout: "5s"
  redis_idle_timeout: "240s"
  node_id: "node-1"
  cluster_name: "secauto-cluster"
  heartbeat_interval: 30
  election_timeout: 300
  job_timeout: 3600
  # Job storage TTL settings in seconds (0 = no expiration)
  job_storage_ttl: 0       # Default: no expiration for job storage
  running_job_ttl: 7200    # 2 hours for running jobs (timeout stuck jobs)
  completed_job_ttl: 86400 # 24 hours for completed jobs
  failed_job_ttl: 604800   # 7 days for failed jobs (keep for debugging)
  max_retries: 3
  retry_delay: 5
  load_balancing: "round_robin"
  health_check_interval: 60
  failover_enabled: true


# Security Configuration
security:
  api_keys:
    - "secauto-api-key-2024-07-14"
    - "another-api-key-if-needed"
  api_keys_file: "data/security/api_keys.json"
  integration_encryption_key: "your-secure-encryption-key-for-integrations"
  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst_limit: 20
    window_size: "1m"
    endpoints:
      health: 1000
      playbook: 50
      playbook_async: 30
      jobs: 100
      job_status: 200
      job_stats: 60
      job_metrics: 60
      context: 100
      cluster: 30
      schedules: 30
      cache: 200
      default: 100
  input_validation:
    enabled: true
    max_context_size: 1048576
    max_playbook_size: 1048576
    max_script_size: 1048576
    allowed_script_extensions: [".py"]
    sanitize_inputs: true
  cors:
    enabled: true
    # Allow all origins (use specific domains in production)
    allowed_origins: ["*"]
    # Allowed HTTP methods
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    # Allowed headers
    allowed_headers: ["Content-Type", "Authorization", "X-API-Key", "Accept", "Origin"]
    # Cache preflight requests for 24 hours
    max_age: 86400
  # TLS/HTTPS Configuration
  tls:
    enabled: false                    # Set to true to enable HTTPS
    port: 9443                       # HTTPS port (default 443 for production)
    cert_file: "certs/server.crt"    # Path to TLS certificate
    key_file: "certs/server.key"     # Path to TLS private key
    auto_redirect: true              # Redirect HTTP to HTTPS
    min_version: "1.2"               # Minimum TLS version (1.0, 1.1, 1.2, 1.3)
    max_version: "1.3"               # Maximum TLS version
    cipher_suites: []                # Empty = use Go defaults (recommended)
    # Certificate management
    auto_cert:
      enabled: false                 # Enable automatic certificate management
      domains: ["localhost"]         # Domains for auto certificates
      cache_dir: "certs/autocert"    # Directory to cache certificates
      email: ""                      # Email for Let's Encrypt registration
    # Client certificate authentication (mutual TLS)
    client_auth:
      enabled: false                 # Enable client certificate verification
      ca_file: "certs/ca.crt"       # CA certificate for client verification
      require_cert: false            # Require client certificates

# Python Configuration
python:
  venv_path: "../Venv"
  scripts_path: "data/automations/scripts"

# Integrations Configuration
integrations:
  base_path: "data/integrations"  # Base directory for integrations
  configs_path: "data/integrations/configs"
  scripts_path: "data/integrations/scripts"
  builder_script_path: "scripts/integration_builder.py"  # Path to integration builder script
  venvs_path: "venvs"  # Relative to base_path, or absolute path
  # Alternative configuration example:
  # base_path: "/custom/integrations/path"
  # venvs_path: "/custom/venvs/path"
  external_apis:
    max_connections: 100
    timeout: 30
    retry_count: 3
    retry_delay: 5
  file_systems:
    allowed_paths: ["../data", "../logs", "../backups"]
    max_file_size: 10485760
    allowed_extensions: [".json", ".yaml", ".yml", ".txt", ".log"]
  network:
    allowed_hosts: ["*"]
    blocked_hosts: []
    max_connections: 100
    connection_timeout: 30