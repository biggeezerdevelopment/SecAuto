# SecAuto Security-Hardened Configuration
# This configuration maximizes security while maintaining functionality
# 
# IMPORTANT: 
# - Change all API keys and secrets before deploying
# - Review network settings for your environment
# - Adjust resource limits based on your requirements

# Server Configuration - Secure Settings
server:
  port: 9090
  host: "0.0.0.0"        # Listen on all interfaces for external API access
  workers: 5
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  max_header_bytes: 1048576

# Logging Configuration - Security-Focused
logging:
  level: "INFO"           # Don't use DEBUG in production
  destination: "both"
  file: "logs/secauto.log"
  rotation:
    max_size_mb: 50       # Larger log files for security auditing
    max_backups: 10       # Keep more backups for forensics
    max_age_days: 90      # Longer retention for compliance
    compress: true
  format: "json"          # Structured logs for SIEM integration
  include_timestamp: true
  include_component: true
  include_request_id: true
  component_levels:
    rules_engine: "WARNING"
    redis_integration: "ERROR"
    job_manager: "INFO"
    webhook_system: "INFO"
    plugin_system: "WARNING"
    cluster_manager: "INFO"
    default: "INFO"
  performance:
    skip_context_logging: true    # Skip large context objects
    max_log_field_length: 500     # Truncate long field values
    batch_logging: false
    async_logging: false

# Database Configuration (Redis) - Secure Settings
database:
  redis_url: "redis://localhost:6379/0"
  cache_ttl: 1800         # 30 minutes - shorter for security
  job_ttl: 43200         # 12 hours - shorter retention
  temp_data_ttl: 300     # 5 minutes

# Cluster Configuration - Production Ready
cluster:
  enabled: false          # Enable for multi-node deployments
  redis_url: "redis://localhost:6379/1"
  redis_db: 1
  redis_password: ""      # SET THIS IN PRODUCTION
  redis_pool_size: 10
  redis_pool_timeout: "5s"
  redis_idle_timeout: "240s"
  node_id: "secauto-node-1"
  cluster_name: "secauto-production"
  heartbeat_interval: 30
  election_timeout: 300
  job_timeout: 1800       # 30 minutes max job time
  job_storage_ttl: 0
  running_job_ttl: 7200   # 2 hours for running jobs
  completed_job_ttl: 43200 # 12 hours for completed jobs
  failed_job_ttl: 86400   # 24 hours for failed jobs (debugging)
  max_retries: 3
  retry_delay: 5
  load_balancing: "round_robin"
  health_check_interval: 60
  failover_enabled: true

# Scheduler Configuration - Resource Limited
scheduler:
  enabled: true
  max_concurrent_jobs: 5    # Lower limit for security
  cleanup_interval: 1800    # 30 minutes
  retention_days: 7         # Shorter retention
  timezone: "UTC"
  default_timeout: 1800     # 30 minutes max
  max_schedules: 50         # Limit number of schedules
  schedule_cleanup_interval: 3600
  failed_job_retention: 3   # Keep failed jobs for 3 days
  successful_job_retention: 1 # Keep successful jobs for 1 day

# Plugins Configuration - SANDBOXED
plugins:
  enabled: true
  directory: "plugins"
  hot_reload: false         # Disabled for security
  reload_interval: 300      # Longer interval if enabled
  supported_types: ["python"] # Only Python for security
  max_plugins: 20           # Strict limit
  plugin_timeout: 120       # 2 minutes max
  sandbox_mode: true        # CRITICAL: Enable sandbox
  allow_executables: false  # SECURITY: No executable plugins
  allow_python: true
  allow_go_plugins: false   # SECURITY: Disable Go plugins
  plugin_validation: true
  plugin_logging: true
  platforms:
    windows:
      enabled: false        # SECURITY: Disable Windows plugins
    linux:
      enabled: false        # SECURITY: Disable Linux plugins
    python:
      enabled: true
      directory: "plugins/python"
      supported_extensions: [".py"]
      timeout: 120          # 2 minutes max
      sandbox_mode: true    # CRITICAL: Enable sandbox
      interpreter: "Venv/bin/python"
      max_memory: 128       # 128MB limit
      allow_network_access: false  # SECURITY: No network access
      allow_file_access: false     # SECURITY: No file access
    go:
      enabled: false        # SECURITY: Disable Go plugins

# Security Configuration - MAXIMUM SECURITY
security:
  # IMPORTANT: Change these API keys in production
  api_keys:
    - "CHANGE-THIS-SECURE-API-KEY-PRODUCTION"
    - "CHANGE-THIS-BACKUP-API-KEY-PRODUCTION"
  api_keys_file: "data/security/api_keys.json"
  integration_encryption_key: "CHANGE-THIS-INTEGRATION-ENCRYPTION-KEY-32CHARS-MINIMUM"
  
  # Rate Limiting - Strict Limits
  rate_limiting:
    enabled: true
    requests_per_minute: 60   # Lower limit for security
    burst_limit: 10           # Lower burst
    window_size: "1m"
    endpoints:
      health: 200             # Allow health checks
      playbook: 10            # Strict playbook limits
      playbook_async: 5       # Very strict async limits
      jobs: 30
      job_status: 60
      job_stats: 10
      job_metrics: 10
      context: 20
      webhooks: 5             # Very strict webhook limits
      plugins: 5              # Very strict plugin limits
      cluster: 10
      schedules: 10
      cache: 30
      default: 20             # Low default
  
  # Input Validation - STRICT
  input_validation:
    enabled: true
    max_context_size: 102400      # 100KB max (reduced)
    max_playbook_size: 102400     # 100KB max (reduced)
    max_script_size: 51200        # 50KB max (reduced)
    allowed_script_extensions: [".py"] # Only Python
    sanitize_inputs: true
  
  # CORS - Restricted
  cors:
    enabled: true
    allowed_origins: ["https://your-dashboard.company.com"] # CHANGE THIS
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Content-Type", "Authorization", "X-API-Key", "Accept"]
    max_age: 3600             # 1 hour cache
  
  # TLS - ENABLE IN PRODUCTION
  tls:
    enabled: false              # CHANGE TO TRUE IN PRODUCTION
    cert_file: "/etc/ssl/certs/secauto.crt"
    key_file: "/etc/ssl/private/secauto.key"
    min_version: "1.3"          # TLS 1.3 minimum

# Webhooks Configuration - Limited
webhooks:
  enabled: true
  timeout: 10                   # Shorter timeout
  retry_count: 2                # Fewer retries
  retry_delay: 5
  max_webhooks: 10              # Strict limit
  events:
    - "job_failed"              # Only critical events
    - "automation_uploaded"
  default_headers:
    Content-Type: "application/json"
    User-Agent: "SecAuto/1.0"

# Python Configuration - MAXIMUM SECURITY
python:
  venv_path: "Venv"
  scripts_path: "automations"
  playbooks_path: "playbooks"
  default_script: "default_automation.py"
  script_timeout: 120             # 2 minutes max
  max_script_memory: 128          # 128MB limit
  allow_network_access: false     # SECURITY: No network access
  allow_file_access: false        # SECURITY: No file access
  sandbox_mode: true              # SECURITY: Enable sandbox
  hot_reload: false               # SECURITY: Disable hot reload
  script_validation: true

# Rules Engine Configuration - Secure Limits
rules_engine:
  max_nesting_depth: 5            # Lower limit
  max_conditions_per_rule: 20     # Lower limit
  max_variables_per_context: 100  # Lower limit
  enable_debug_mode: false        # SECURITY: Disable debug
  strict_mode: true               # SECURITY: Enable strict mode
  allow_custom_functions: false   # SECURITY: No custom functions
  max_execution_time: 120         # 2 minutes max
  memory_limit: 128               # 128MB limit
  caching:
    max_contexts: 100             # Lower cache limits
    max_expressions: 500
    max_variables: 200
    context_ttl: "10m"            # Shorter TTL
    expression_ttl: "5m"
    variable_ttl: "5m"
    cleanup_interval: "2m"
    enable_lazy_eval: true
    enable_expression_cache: true
    max_field_size: 1000

# Monitoring Configuration - Security Focused
monitoring:
  enabled: true
  metrics_interval: 60
  health_check_interval: 30
  performance_tracking: true
  slow_query_threshold: 1000      # 1 second threshold
  memory_usage_tracking: true
  cpu_usage_tracking: true
  disk_usage_tracking: true
  custom_metrics: true

# Performance Configuration - Resource Limited
performance:
  worker_pool_size: 5             # Lower worker count
  job_queue_size: 100             # Smaller queue
  context_cache_size: 100         # Smaller cache
  plugin_cache_size: 20           # Smaller cache
  schedule_cache_size: 50         # Smaller cache
  webhook_queue_size: 20          # Smaller queue
  max_concurrent_requests: 20     # Lower concurrency
  request_timeout: 30
  enable_compression: true
  enable_caching: true
  cache_ttl: 300

# Development Configuration - PRODUCTION HARDENED
development:
  debug_mode: false               # SECURITY: Disable debug
  verbose_logging: false          # SECURITY: Disable verbose logging
  hot_reload_enabled: false       # SECURITY: Disable hot reload
  auto_restart: false             # SECURITY: Disable auto restart
  profile_enabled: false          # SECURITY: Disable profiling
  trace_enabled: false            # SECURITY: Disable tracing
  mock_external_services: false   # SECURITY: Disable mocking
  test_mode: false                # SECURITY: Disable test mode

# Backup Configuration - ENABLE FOR PRODUCTION
backup:
  enabled: false                  # ENABLE IN PRODUCTION
  schedule: "0 2 * * *"           # Daily at 2 AM
  retention_days: 30
  compression: true
  encryption: true
  encryption_key: "CHANGE-THIS-BACKUP-ENCRYPTION-KEY-32CHARS"
  backup_location: "/var/backups/secauto"
  include_logs: true
  include_config: false           # Don't backup secrets
  include_plugins: true
  max_backup_size: 1073741824    # 1GB max

# Notifications Configuration - Configure as needed
notifications:
  email:
    enabled: false                # Configure for production
    smtp_server: "smtp.company.com"
    smtp_port: 587
    username: ""                  # SET IN PRODUCTION
    password: ""                  # SET IN PRODUCTION
    from_address: "secauto@company.com"
    to_addresses: ["security@company.com"]
  slack:
    enabled: false                # Configure for production
    webhook_url: ""               # SET IN PRODUCTION
    channel: "#security-alerts"
    username: "SecAuto Security Bot"
  teams:
    enabled: false
    webhook_url: ""
  discord:
    enabled: false
    webhook_url: ""

# Integrations Configuration - RESTRICTED
integrations:
  configs_path: "data/integrations/configs"
  scripts_path: "data/integrations/scripts"
  external_apis:
    max_connections: 10           # Lower limit
    timeout: 10                   # Shorter timeout
    retry_count: 2                # Fewer retries
    retry_delay: 5
  file_systems:
    allowed_paths: ["data", "logs"] # Restricted paths
    max_file_size: 1048576        # 1MB max
    allowed_extensions: [".json", ".yaml", ".txt"] # Limited extensions
  network:
    allowed_hosts: []             # SECURITY: No external hosts by default
    blocked_hosts: ["127.0.0.1", "localhost", "0.0.0.0"] # Block internal access
    max_connections: 5            # Very limited
    connection_timeout: 10        # Short timeout

# Environment-specific configurations
environments:
  production:
    logging:
      level: "WARNING"            # Less verbose in production
      component_levels:
        default: "WARNING"
    security:
      rate_limiting:
        requests_per_minute: 30   # Even stricter in production
    development:
      debug_mode: false
      verbose_logging: false
  staging:
    logging:
      level: "INFO"
    security:
      rate_limiting:
        requests_per_minute: 60
    development:
      debug_mode: false
      verbose_logging: false