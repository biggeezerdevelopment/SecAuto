# Test Configuration for SecAuto
# This configuration is used for unit and integration tests

server:
  port: 9091  # Different port to avoid conflicts
  host: "localhost"
  workers: 2
  read_timeout: "10s"
  write_timeout: "10s"
  idle_timeout: "30s"
  max_header_bytes: 1048576

logging:
  level: "DEBUG"
  destination: "stdout"  # Log to stdout for tests
  file: ""  # No file logging in tests
  format: "json"
  include_timestamp: true
  include_component: true
  include_request_id: true
  component_levels:
    default: "DEBUG"

database:
  redis_url: "redis://localhost:6379/15"  # Use test database
  cache_ttl: 60
  job_ttl: 300
  temp_data_ttl: 30

security:
  api_keys:
    - "test-api-key-12345"
    - "test-api-key-67890"
  api_keys_file: "testdata/security/test_api_keys.json"
  rate_limiting:
    enabled: false  # Disable for tests
  input_validation:
    enabled: true
    max_context_size: 10240
    max_playbook_size: 10240
    max_script_size: 10240
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Content-Type", "Authorization", "X-API-Key"]

python:
  venv_path: "../Venv"
  scripts_path: "../automations"
  playbooks_path: "testdata/playbooks"
  script_timeout: 30  # Shorter timeout for tests

integrations:
  configs_path: "testdata/integrations/configs"
  scripts_path: "testdata/integrations/scripts"

cluster:
  enabled: false  # Disable clustering for unit tests